[package]
name = "boss-testing"
description = "Shared test utilities for Boss service testing"
version.workspace = true
edition.workspace = true

[features]
default = []
postgres = ["dep:sqlx", "dep:uuid"]

[dependencies]
boss-core = { path = "../boss-core" }
axum = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
tower = { workspace = true }
http-body-util = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "postgres"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Test-only, and only for `run_car_probe_sh.rs`: the probe's reader role
# is written in infra/forge/run-car-probe.sh and DEFINED in core policy's
# default rules. Two homes for one fact, so the test pins them equal
# (CLAUDE.md §9a) — `audit-readonly` must grant Read everywhere a probe
# reads and no non-Read action anywhere. Core → core; no tier crossing.
boss-policy-client = { path = "../boss-policy-client" }

[[test]]
name = "migrate_sh"
required-features = ["postgres"]

[[test]]
name = "fixture_smoke"
required-features = ["postgres"]

[lints]
workspace = true
