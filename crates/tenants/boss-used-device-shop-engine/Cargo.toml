[package]
name = "boss-used-device-shop-engine"
description = "Used-device-shop operating-engine library + tenant CLI. Sister crate to boss-brewery-engine — loads the used-device-shop seed bundle (tenant.toml + workflows.toml + employees.json), drives the day-loop via run_days, and ships the `boss-used-device-shop-engine prepare` bin that seeds the tenant model onto a running stack."
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

boss-jobs = { path = "../../core/boss-jobs" }
boss-policy = { path = "../../core/boss-policy", default-features = false }
boss-ports = { path = "../../core/boss-ports" }
boss-sim = { path = "../../orchestrators/boss-sim" }

[lints]
workspace = true
