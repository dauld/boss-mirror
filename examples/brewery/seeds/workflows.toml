metadata_defaults = { batch_id = "", excise_bbl = 60, produces_products = [
    { sku = "FP-STOUT-1-6-BBL", qty = 360, location_id = "loc-brewery-brewhouse", unit_cost_cents = 850 },
], parts_consumed = [
    { part_sku = "PKG-KEG-FILL-SIXTEL", qty = 360 },
] }

# Skip branches — the "oversupply" outcome of each per-format gate.
