[[workflow.step]]
title = "compile-kpis"
kind = "task"
ready_when = "steps.trigger.done"
authority_role = "fp-analyst"
title_template = "Compile the weekly KPI pack"
duration_hours = 4.0

[[workflow.step]]
title = "finance-readout"
kind = "task"
ready_when = "steps.compile-kpis.done"
authority_role = "controller"
title_template = "Finance readout — cash, margin, aging"
duration_hours = 1.0

[[workflow.step]]
title = "sales-readout"
kind = "task"
ready_when = "steps.compile-kpis.done"
authority_role = "head-of-sales"
title_template = "Sales readout — pipeline, orders, accounts"
