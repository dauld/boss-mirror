authority_role = "head-brewer"
title_template = "Demand check — should we brew Stout today?"
# TOP GATE — fire the mash if EITHER package format is below its
# reorder threshold. target_skus lists both formats; the brew makes
# only the format(s) actually short downstream (demand-check-half /
# demand-check-sixtel → package-half / package-sixtel). One mash,
# split packaging. See morning-brew (pale) for the full rationale.
