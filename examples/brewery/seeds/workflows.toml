[[workflow.step]]
title = "fermentation-start"
kind = "task"
ready_when = "steps.whirlpool.done"
authority_role = "brewer"
title_template = "Fermentation start (pitch yeast)"
# Honest fermentation time: a stout conditions ~10 days.
duration_hours = 240.0
metadata_defaults = { ferm_temp_c = 18, yeast_strain = "English Ale", vessel = "" }

# PACKAGING ALLOCATION — one tank of fungible wort, split across formats by
# demand shortfall so the whole ~110-BBL batch ALWAYS packages (WIP → FG,
# never dumped); an over-supplied format gets zero and routes to its skip.
# See morning-brew (pale) for the full rationale; all numbers are data.
[[workflow.step]]
title = "allocate-packaging"
kind = "packaging-allocate"
ready_when = "steps.fermentation-start.done"
authority_role = "head-brewer"
title_template = "Allocate packaging — split the batch by demand"
# `outcome_half` / `outcome_sixtel` are stamped by the packaging.allocate
# handler at run time (a format allocated zero kegs → "skip", else "package").
# Declared inline here as `package|skip` — tenant data — so the viability lint
# proves the per-format fork covers every outcome, without pushing brewery
# format names into the core packaging-allocate StepType.
fields = [{ name = "outcome_half", field_type = "package|skip", required = false }, { name = "outcome_sixtel", field_type = "package|skip", required = false }]
metadata_defaults = { batch_bbl = 110, target_skus = ["FP-STOUT-1-2-BBL", "FP-STOUT-1-6-BBL"], expected_daily_demand = { FP-STOUT-1-2-BBL = 64, FP-STOUT-1-6-BBL = 64 }, batch_yield = { FP-STOUT-1-2-BBL = 100, FP-STOUT-1-6-BBL = 360 }, default_kegs = { FP-STOUT-1-2-BBL = 100, FP-STOUT-1-6-BBL = 360 }, fork_keys = { FP-STOUT-1-2-BBL = "half", FP-STOUT-1-6-BBL = "sixtel" }, demand_window_days = 30, oversupply_multiplier = 1.5 }

[[workflow.step]]
title = "package-half"
