[[workflow.step]]
title = "ceo-review"
kind = "sign-off"
fields = [{ name = "decision", field_type = "pending|approved|rejected|changes-requested", required = true }]
ready_when = "steps.ops-decisions.done"
authority_role = "ceo"
title_template = "CEO sign-off on the week"
sign_offs_required = ["ceo"]

[[workflow.step]]
title = "review-closed"
kind = "outcome"
ready_when = "steps.ceo-review.done"
title_template = "Leadership review closed"
terminal = { outcome = "completed" }
metadata_defaults = { outcome_kind = "completed" }

# ---------------------------------------------------------------------------
# People-ops cycle — HR's recurring administration. The hire/terminate
# Workflows exist but their sim rates are 0 (the duplicate-executive-
# hire defect keeps them registry-only), so hr-generalist (6),
# benefits-coord (1), and recruiter (1) need a rhythm that actually
# opens: the weekly people-ops cycle. Opened by
# `[periodic.weekly-people-ops]`.
# ---------------------------------------------------------------------------

[[workflow]]
kind = "people-ops-cycle"
metadata = { owner_role = "hr-generalist" }
label = "Weekly People-Ops Cycle"
category = "hr"
subject_kinds = ["company"]
description = """
Weekly people-department administration: timekeeping audit ahead of
the biweekly payroll run, benefits reconciliation (enrollments,
deductions, carrier invoices), and the requisition-pipeline review.
"""

[[workflow.step]]
title = "trigger"
kind = "trigger"
ready_when = "true"
title_template = "Weekly people-ops cycle fires"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "weekly-people-ops" }

[[workflow.step]]
title = "timekeeping-audit"
kind = "task"
ready_when = "steps.trigger.done"
authority_role = "hr-generalist"
title_template = "Timekeeping audit — hours vs schedules"
duration_hours = 3.0

[[workflow.step]]
title = "benefits-reconciliation"
kind = "task"
ready_when = "steps.timekeeping-audit.done"
authority_role = "benefits-coord"
title_template = "Benefits reconciliation — enrollments + carrier invoices"
duration_hours = 3.0

[[workflow.step]]
title = "pipeline-review"
kind = "task"
ready_when = "steps.benefits-reconciliation.done"
authority_role = "recruiter"
title_template = "Requisition pipeline review"
duration_hours = 2.0

# head-of-people's ONLY other step lives in brewery-terminate, whose
# sim rate is 0 — without this weekly review the department head
# never acts.
[[workflow.step]]
title = "people-review"
kind = "task"
ready_when = "steps.pipeline-review.done"
authority_role = "head-of-people"
title_template = "Head-of-people weekly review"
duration_hours = 1.0
terminal = { outcome = "completed" }
