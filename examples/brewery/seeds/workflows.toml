The weekly operating review: FP&A compiles the KPI pack, each
function reads out (finance, sales, marketing, systems), the COO
turns readouts into decisions, the CEO signs the week.
"""

[[workflow.step]]
title = "trigger"
kind = "trigger"
ready_when = "true"
title_template = "Weekly leadership review fires"
