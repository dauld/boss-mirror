metadata_defaults = { target_skus = ["FP-STOUT-1-2-BBL", "FP-STOUT-1-6-BBL"], expected_daily_demand = { FP-STOUT-1-2-BBL = 64, FP-STOUT-1-6-BBL = 64 }, batch_yield = { FP-STOUT-1-2-BBL = 100, FP-STOUT-1-6-BBL = 360 }, demand_window_days = 30, oversupply_multiplier = 1.5, is_demand_check = true }

[[workflow.step]]
title = "plan"
kind = "scheduling"
ready_when = "steps.demand-check.done AND steps.demand-check.metadata.outcome = \"brew\""
authority_role = "senior-brewer"
title_template = "Plan today's stout — {subject.id}"
metadata_defaults = { recipes_planned = ["Dry Irish Stout"], batch_size_bbl = 30 }

[[workflow.step]]
title = "mash-in"
kind = "production-consume"
ready_when = "steps.plan.done"
title_template = "Mash in (drain stout ingredients)"
authority_role = "brewer"
# Stout grain bill: base 2-row + roasted barley + chocolate malt
