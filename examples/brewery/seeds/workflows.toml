metadata_defaults = { parts_consumed = [
    { part_sku = "PKG-CO2-50LB", qty = 1 },
] }

[[workflow.step]]
title = "verify-back-in-service"
kind = "sign-off"
fields = [{ name = "decision", field_type = "pending|approved|rejected|changes-requested", required = true }]
ready_when = "steps.service-parts.done"
title_template = "Verify back in service"
authority_role = "head-brewer"
sign_offs_required = ["head-brewer"]

[[workflow.step]]
title = "back-in-service"
kind = "outcome"
ready_when = "steps.verify-back-in-service.done"
title_template = "Equipment back in service"
terminal = { outcome = "completed" }
