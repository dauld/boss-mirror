metadata_defaults = { outcome_kind = "skipped" }

# ---------------------------------------------------------------------------
# Morning brew — Lager day. Pilsner malt + noble hops + lager yeast.
# Real lagers need 4-6 weeks of cold conditioning before packaging;
# the sim collapses that to the same one-day cycle as ales for
# brewhouse-scheduling parity. Tap-room Lagers move steady but slow.
# ---------------------------------------------------------------------------

[[workflow]]
kind = "morning-brew-lager"
# Q7: the responsible human owner's role for Jobs of this kind.
metadata = { owner_role = "shift-lead" }
label = "Morning Brew — Lager"
category = "production"
subject_kinds = ["company"]
description = """
Daily Lager brewing cycle. Same step graph as morning-brew. Pilsner
malt grain bill, noble hops, lager yeast. Output is FP-LAGER-*.
Note: real cold conditioning is collapsed for sim purposes.
"""

# Trigger + brew/skip fork — see morning-brew (pale) for the full
# pattern.
# REVIEW(v2 fork): brew/skip fork over the free-text
# `checklist.outcome` field — same shape as morning-brew (pale).
# Branches mutually exclusive on `= "brew"` / `= "oversupply"`;
# lint-clean coverage wants `checklist.outcome` as a declared enum.
[[workflow.step]]
title = "trigger"
kind = "trigger"
ready_when = "true"
title_template = "Periodic action — daily lager brewing schedule fires"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "morning-brew-shift" }

[[workflow.step]]
title = "demand-check"
kind = "demand-gate"
ready_when = "steps.trigger.done"
authority_role = "head-brewer"
title_template = "Demand check — should we brew Lager today?"
# TOP GATE — fire the mash if EITHER package format is below its
# reorder threshold. target_skus lists both formats; the brew makes
# only the format(s) actually short downstream (demand-check-half /
# demand-check-sixtel → package-half / package-sixtel). One mash,
# split packaging. See morning-brew (pale) for the full rationale.
# batch_yield: Lager packages 200 half-BBL + 200 sixtels per brew.
metadata_defaults = { target_skus = ["FP-LAGER-1-2-BBL", "FP-LAGER-1-6-BBL"], expected_daily_demand = { FP-LAGER-1-2-BBL = 50, FP-LAGER-1-6-BBL = 50 }, batch_yield = { FP-LAGER-1-2-BBL = 200, FP-LAGER-1-6-BBL = 200 }, demand_window_days = 30, oversupply_multiplier = 1.5, is_demand_check = true }

