# ---------------------------------------------------------------------------
# Batch QC Hold — anomaly-path Sub-Job for morning-brew (and other
# production Workflows). When a QC checkpoint flags off-spec results
# (microbial contamination, pH drift, gravity miss), the parent Job
# spawns one of these on the same brewhouse Subject. This is the
# canonical example of how the Job abstraction handles non-DAG
# flows — the parent waits at the QC step while this sub-Job runs
# its own decision tree, and the parent step transitions to
# completed (resume packaging) or aborted (write-off + re-brew)
# based on the triage outcome.
#
# Step graph branches by `tier 2` triage decision:
#   - Tier 3a `re-test` runs another QC scan; if passing the parent
#     QC step completes and packaging proceeds.
#   - Tier 3b `re-blend` adjusts the batch via dilution / adjunct
#     addition; parent QC step completes.
#   - Tier 3c `discard` initiates batch-loss accounting; parent QC
#     step aborts; a `batch-writeoff-recovery` Job opens for the
#     financial side.
#
# The audit log reads as a real causal trace — each branch carries
# its own actor (qa-tech for lab, qa-supervisor for triage,
# packaging-tech for blend), and the cross-Job linkage via
# `parent_job_id` in metadata makes the sub-Job query-able from
# the parent and vice versa.
# ---------------------------------------------------------------------------

[[workflow]]
kind = "batch-qc-hold"
# Q7: the responsible human owner's role for Jobs of this kind.
metadata = { owner_role = "qa-tech" }
label = "Batch QC Hold (anomaly branch)"
category = "production"
subject_kinds = ["company"]
description = """
Opened when a parent production Job (typically morning-brew) flags
a QC anomaly. Lab analysis + triage decision; outcome determines
whether the parent batch packages, re-blends, or gets written off.
The parent Workflow waits on this sub-Job before completing its QC
step.
"""

# Linear chain. The triage-decision branches (re-test / re-blend /
# discard) described in the header are captured in the
# `apply-triage` step's `branch` metadata + the `triage-decision`
# sign-off's `decision`, not as separate predicate-graph branches —
# the sub-Job resolves to one terminal (release hold) regardless of
# branch, so a linear chain is the faithful v2 shape.
[[workflow.step]]
title = "lab-analysis"
kind = "task"
ready_when = "true"
authority_role = "qa-tech"
title_template = "Lab analysis — collect + run extended panel"
metadata_defaults = { panel = ["pH", "fg", "abv", "diacetyl", "microbial_plating"], parent_job_id = "", parent_step_id = "", batch_id = "" }

[[workflow.step]]
title = "document-findings"
kind = "task"
ready_when = "steps.lab-analysis.done"
authority_role = "qa-tech"
title_template = "Document findings — extended results"
metadata_defaults = { findings = "", anomaly_confirmed = false }

[[workflow.step]]
title = "triage-decision"
kind = "sign-off"
fields = [{ name = "decision", field_type = "pending|approved|rejected|changes-requested", required = true }]
ready_when = "steps.document-findings.done"
authority_role = "qa-supervisor"
title_template = "Triage decision — re-test, re-blend, or discard"
sign_offs_required = ["qa-supervisor"]
metadata_defaults = { decision = "pending", rationale = "" }

[[workflow.step]]
title = "apply-triage"
kind = "task"
ready_when = "steps.triage-decision.done"
authority_role = "qa-tech"
title_template = "Apply triage decision — execute the branch"
metadata_defaults = { branch = "", action_taken = "" }

[[workflow.step]]
title = "release-hold"
kind = "handoff"
ready_when = "steps.apply-triage.done"
authority_role = "qa-supervisor"
title_template = "Resume parent Job — release hold"
terminal = { outcome = "resolved" }
metadata_defaults = { release_decision = "", parent_resumes = true }



# ---------------------------------------------------------------------------
# AP Payment Run — daily batch settlement of approved vendor bills.
#
# Procurement (ingredient-restock) ends at bill-approval (DR 1300 /
# CR 2100). This Job picks up from there: every business day a
# bookkeeper opens an ap-payment-run on the brewery location,
# queries approved-but-unpaid vendor_invoices due within the window,
# cuts a check / ACH for each, and marks them paid. The mark-paid
# side effect fires inventory.vendor_invoice.paid which projects
# to finance.bill.paid (DR 2100 / CR 1000 cash out, AP drains).
#
# Without this Job the direct-method cash flow shows AP credits
# but zero debits — bills accrue forever, books drift from cash
# reality. (#128 finding.)
# ---------------------------------------------------------------------------

[[workflow]]
kind = "ap-payment-run"
# Q7: the responsible human owner's role for Jobs of this kind.
metadata = { owner_role = "ap-clerk" }
label = "Daily AP Payment Run"
category = "finance"
subject_kinds = ["company"]
description = """
Daily batch settlement of approved vendor invoices. Subject is
the brewery location (the entity issuing the checks / ACH).
The bookkeeper queries approved-but-unpaid bills due within the
window, batches them into a single payment run, and marks each
paid via a side-effect that drains 2100 AP back into 1000 Cash.
"""

[[workflow.step]]
title = "pull-aging-report"
kind = "task"
ready_when = "true"
# 1533872f — AP clerking is the ap-clerk's job (the Workflow's own
# owner_role has said so all along); the 2 bookkeepers were doing it
# while all 6 ap-clerks idled. Bookkeeper keeps the provenance
# record below — clerk cuts, bookkeeper records.
authority_role = "ap-clerk"
title_template = "Pull due-bills aging report"
# At step.done the engine will populate `invoices_to_pay` with
# the IDs of vendor_invoices where status=approved + due_on
# within the window. v1 uses a max-30-day window so payments
# track standard net-30 terms.
metadata_defaults = { window_days = 30, invoices_to_pay = [] }

[[workflow.step]]
title = "cut-checks"
kind = "bill-payment-batch"
ready_when = "steps.pull-aging-report.done"
authority_role = "ap-clerk"
title_template = "Cut checks + ACH for due bills"
# This step's side-effect handler (inventory.bill.payment_batch)
# emits a single inventory.bill.payment_batch topic. The route
# table sends it to POST /api/inventory/vendor-invoices/batch-pay
# which queries status=approved invoices, flips each to paid
# (paid_on = step.day), and emits one inventory.vendor_invoice.paid
# per invoice. Those project to finance.bill.paid → DR 2100 / CR 1000.
metadata_defaults = { payment_method = "ach", check_run_id = "" }

[[workflow.step]]
title = "record-provenance"
kind = "task"
ready_when = "steps.cut-checks.done"
authority_role = "bookkeeper"
title_template = "Record check-run provenance + file"
terminal = { outcome = "completed" }
# Audit-trail closer: log totals + match GL period.
metadata_defaults = { total_paid_cents = 0, bill_count = 0, run_notes = "" }

# ---------------------------------------------------------------------------
# Taproom shift close — daily by-the-pour sales of the sixtels + co-product
# half-BBLs the brewery over-produces. Wholesale buys PALE-1/2 + IPA-1/6, so
# PALE-1/6 + IPA-1/2 accumulate; the taproom monetizes that surplus at retail
# pour value and posts to Revenue — Taproom (4120). The billing line_items
# drive both the FG decrement and the revenue+COGS JE (post-#105).
# ---------------------------------------------------------------------------
[[workflow]]
kind = "taproom-shift-close"
label = "Taproom Shift Close"
category = "sales"
subject_kinds = ["account"]
description = """
End-of-day taproom reconciliation: ring up the shift's by-the-glass sales
(poured from surplus sixtels + co-product half-BBLs) and post the day's
taproom revenue. One per operating day; a shift-lead closes the register and
a bookkeeper posts the revenue.
"""

[[workflow.step]]
title = "ring-sales"
kind = "order-intake"
ready_when = "true"
title_template = "Ring up taproom shift sales"
authority_role = "shift-lead"
metadata_defaults = { asset_id = "taproom-shift" }

[[workflow.step]]
title = "close-register"
kind = "billing"
ready_when = "steps.ring-sales.done"
title_template = "Close register + post taproom revenue"
authority_role = "bookkeeper"
terminal = { outcome = "completed" }
# By-the-pour retail value: a sixtel (~41 16oz pours) at ~$7 ≈ $287; a
# half-BBL (~124 pours) ≈ $868. ~30 sixtels + 8 half-BBLs of the surplus
# SKUs per shift ≈ $15.5k/day → ~$5.7M/yr taproom revenue. COGS draws on
# the same real FG cost basis as wholesale, so taproom margin is honest.
metadata_defaults = { account_id = "acc-direct-shop", amount_cents = 1555400, currency = "USD", line_items = [
    { sku = "FP-PALE-1-6-BBL", qty = 30, amount_cents = 861000, revenue_category = "taproom", description = "Pale Ale sixtels — by-the-pour (30 × $287)" },
    { sku = "FP-IPA-1-2-BBL", qty = 8, amount_cents = 694400, revenue_category = "taproom", description = "IPA half-BBLs — by-the-pour (8 × $868)" },
] }

# ---------------------------------------------------------------------------
# Distribution contract — bulk sales of surplus co-product kegs to a regional
# distributor at bulk (below-retail) pricing. Posts to Revenue — Distribution
# Contracts (4140). Same sale shape; bigger quantities, lower per-unit price.
# ---------------------------------------------------------------------------
[[workflow]]
kind = "distribution-contract"
label = "Distribution Contract"
category = "sales"
subject_kinds = ["account"]
description = """
A bulk pull against a standing distribution contract: a distributor takes a
pallet of the surplus co-product kegs the wholesale flow doesn't move. Bulk
pricing (below taproom/retail), high volume. Posts Revenue — Distribution.
"""

[[workflow.step]]
title = "pull-contract"
kind = "order-intake"
ready_when = "true"
title_template = "Pull distribution contract — {subject.id}"
authority_role = "sales-rep"
metadata_defaults = { asset_id = "distribution-contract" }

[[workflow.step]]
title = "invoice-distributor"
kind = "billing"
ready_when = "steps.pull-contract.done"
title_template = "Invoice distributor — {subject.id}"
authority_role = "ar-clerk"
terminal = { outcome = "completed" }
# Bulk pricing: a surplus sixtel at ~$50 (FOB to distributor), a co-product
# half-BBL at ~$120. ~50 sixtels + 30 half-BBLs per contract ≈ $6.1k → at
# ~1/day ≈ $2.2M/yr distribution revenue.
metadata_defaults = { account_id = "acc-bigseed-0000", amount_cents = 610000, currency = "USD", line_items = [
    { sku = "FP-PALE-1-6-BBL", qty = 50, amount_cents = 250000, revenue_category = "distribution", description = "Pale Ale sixtels — bulk distribution (50 × $50)" },
    { sku = "FP-LAGER-1-2-BBL", qty = 30, amount_cents = 360000, revenue_category = "distribution", description = "Lager half-BBLs — bulk distribution (30 × $120)" },
] }

# ===========================================================================
# THE ROSTER ACTS (1533872f) — recurring operating rhythms for the
# departments whose roles appeared in no live workflow step. Measured
# 2026-08-22 (and re-verified against this seed 2026-09-02): 32 of 51
# roster roles had no step routed to them — the entire taproom (36),
# distribution floor (69), cellar (24), and every staff department. The
# workforce drives ASSIGNED steps and assignment flows from
# authority_role, so a role in no step never acts.
#
# The BOSS answer is protocol data: ten new Workflow kinds below, each
# modeling a real recurring rhythm of an industrial brewer + taproom and
# each waking a bloc of dormant roles. Opened by `[job_rates.*]` /
# `[periodic.*]` rows in tenant.toml — zero engine code.
# ===========================================================================

# ---------------------------------------------------------------------------
# Taproom service shift — the daily operating shift behind the
# taproom-shift-close financial reconciliation (which stays separate:
# that kind rings the register at agent speed; this one is the human
# labor that poured the beer). Wakes taproom-shift-lead (6),
# bartender (12), taproom-server (18) — the largest dormant bloc.
# ---------------------------------------------------------------------------

[[workflow]]
kind = "taproom-service-shift"
metadata = { owner_role = "taproom-shift-lead" }
label = "Taproom Service Shift"
category = "operations"
subject_kinds = ["company"]
description = """
One taproom service shift: the shift lead opens the room, a bartender
preps the tap lines and bar stock, servers work the floor through the
day, the bar breaks down at last call, and the lead files the shift
recap. The register close + revenue posting stay in
taproom-shift-close; this Job is the labor that earns it.
"""

[[workflow.step]]
title = "trigger"
kind = "trigger"
ready_when = "true"
title_template = "Taproom opens — service shift starts"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "taproom-open" }

[[workflow.step]]
title = "open-checklist"
kind = "checklist"
ready_when = "steps.trigger.done"
authority_role = "taproom-shift-lead"
title_template = "Open the room — shift checklist"
metadata_defaults = { items = [
    { label = "count tills", checked = false },
    { label = "POS online", checked = false },
    { label = "menu boards current", checked = false },
    { label = "patio + floor set", checked = false },
] }

[[workflow.step]]
title = "line-prep"
kind = "task"
ready_when = "steps.open-checklist.done"
authority_role = "bartender"
title_template = "Tap line check + bar stock"
duration_hours = 2.0

# The shift itself. labor_hours = wall_clock_hours = 8: a server's
# floor shift consumes a full person-day of capacity AND a full
# calendar shift — the case where the two legs agree, authored
# explicitly so the capacity meter engages.
[[workflow.step]]
title = "floor-service"
kind = "task"
ready_when = "steps.line-prep.done"
authority_role = "taproom-server"
title_template = "Floor service"
labor_hours = 8.0
wall_clock_hours = 8.0

[[workflow.step]]
title = "last-call-close"
kind = "task"
ready_when = "steps.floor-service.done"
authority_role = "bartender"
title_template = "Last call — break down + clean bar and lines"
duration_hours = 3.0

[[workflow.step]]
title = "shift-recap"
kind = "task"
ready_when = "steps.last-call-close.done"
authority_role = "taproom-shift-lead"
title_template = "Shift recap filed"
duration_hours = 0.5
terminal = { outcome = "completed" }

# ---------------------------------------------------------------------------
# Route delivery run — the distribution floor's daily rhythm. The
# wholesale-keg-order `deliver` step (now routed to
# distribution-driver) covers per-order last-mile; this Job is the
# yard work that stages a route: lead plans it, palletizers wrap it,
# forklifts load it, the warehouse manager releases it, a driver runs
# it. Wakes distribution-lead (6), palletizer (15), forklift-operator
# (24), warehouse-mgr (1) + more driver volume.
# ---------------------------------------------------------------------------

[[workflow]]
kind = "route-delivery-run"
metadata = { owner_role = "distribution-lead" }
label = "Route Delivery Run"
category = "operations"
subject_kinds = ["company"]
description = """
One outbound distribution route, dock to dock: route plan → palletize
→ forklift load → manifest release → drive the route → reconcile
empties and paperwork on return.
"""

[[workflow.step]]
title = "trigger"
kind = "trigger"
ready_when = "true"
title_template = "Route dispatch — daily delivery run"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "route-dispatch" }

[[workflow.step]]
title = "build-route-plan"
kind = "task"
ready_when = "steps.trigger.done"
authority_role = "distribution-lead"
title_template = "Build route plan — sequence stops, assign truck"
duration_hours = 1.0

[[workflow.step]]
title = "palletize-orders"
kind = "task"
ready_when = "steps.build-route-plan.done"
authority_role = "palletizer"
title_template = "Palletize + shrink-wrap staged orders"
duration_hours = 3.0

[[workflow.step]]
title = "load-trucks"
kind = "task"
ready_when = "steps.palletize-orders.done"
authority_role = "forklift-operator"
title_template = "Forklift pallets onto the truck"
duration_hours = 2.0

[[workflow.step]]
title = "release-routes"
kind = "handoff"
ready_when = "steps.load-trucks.done"
authority_role = "warehouse-mgr"
title_template = "Release the route — sign the outbound manifest"
metadata_defaults = { from_id = "warehouse", to_id = "distribution" }

# Driving the route is the other full-person-day step: both legs 8h.
[[workflow.step]]
title = "run-route"
kind = "task"
ready_when = "steps.release-routes.done"
authority_role = "distribution-driver"
title_template = "Run the route — deliver + collect empties"
labor_hours = 8.0
wall_clock_hours = 8.0

[[workflow.step]]
title = "reconcile-returns"
kind = "task"
ready_when = "steps.run-route.done"
authority_role = "distribution-lead"
title_template = "Reconcile returns — empties, refusals, paperwork"
duration_hours = 1.0
terminal = { outcome = "completed" }

# ---------------------------------------------------------------------------
# Cellar daily round — the conditioning side of the brewery, which the
# morning-brew family hands off to and which had NO step at all: 24
# cellar-techs were dormant while `brewer` did every brewhouse step.
# Two legs after the fermenter checks: the lab leg (samples → panel)
# and the tank leg (transfers → keg wash/CIP → line sanitation),
# joining at the daily production log. Wakes cellar-tech (24), gives
# lab-tech (9) daily volume (was: seasonal test batches only), and
# wakes packaging-lead (6) + packaging-mgr (1).
# ---------------------------------------------------------------------------

[[workflow]]
kind = "cellar-daily-round"
metadata = { owner_role = "cellar-tech" }
label = "Cellar Daily Round"
category = "production"
subject_kinds = ["company"]
description = """
Daily cellar + packaging-hall round: check every active fermenter
(temps, gravity, pressure), pull QC samples for the lab panel, run
tank transfers and dry-hop additions, cycle the keg washer + CIP
loop, sanitize the packaging line, file the day's production log.
"""

[[workflow.step]]
title = "trigger"
kind = "trigger"
ready_when = "true"
title_template = "Cellar shift starts — daily round"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "cellar-round" }

# The production shift-lead's daily human step. Every other
# shift-lead touchpoint is either owner_role metadata (morning-brew)
# or the agent-completed ring-sales intake — measured under
# 1533872f, shift-leads never completed a step.
[[workflow.step]]
title = "shift-brief"
kind = "task"
ready_when = "steps.trigger.done"
authority_role = "shift-lead"
title_template = "Floor shift brief — priorities + assignments"
duration_hours = 0.5

[[workflow.step]]
title = "fermentation-checks"
kind = "inspection"
ready_when = "steps.shift-brief.done"
authority_role = "cellar-tech"
title_template = "Fermenter checks — temps, gravity, pressure"

# Lab leg.
[[workflow.step]]
title = "pull-samples"
kind = "task"
ready_when = "steps.fermentation-checks.done"
authority_role = "lab-tech"
title_template = "Pull QC samples from active tanks"
duration_hours = 1.0

[[workflow.step]]
title = "run-lab-panel"
kind = "task"
ready_when = "steps.pull-samples.done"
authority_role = "lab-tech"
title_template = "Run lab panel — pH, gravity, micro plating"
duration_hours = 2.0

# Tank leg (parallel with the lab leg).
[[workflow.step]]
title = "tank-transfers"
kind = "task"
ready_when = "steps.fermentation-checks.done"
authority_role = "cellar-tech"
title_template = "Tank transfers + dry-hop additions"
duration_hours = 3.0

[[workflow.step]]
title = "keg-wash-cip"
kind = "task"
ready_when = "steps.tank-transfers.done"
authority_role = "cellar-tech"
title_template = "Keg washer + CIP loop on emptied tanks"
duration_hours = 3.0

[[workflow.step]]
title = "line-sanitation"
kind = "task"
ready_when = "steps.keg-wash-cip.done"
authority_role = "packaging-lead"
title_template = "Packaging line changeover + sanitation"
duration_hours = 2.0

[[workflow.step]]
title = "production-log"
kind = "task"
ready_when = "steps.run-lab-panel.done AND steps.line-sanitation.done"
authority_role = "packaging-mgr"
title_template = "File the day's cellar + packaging log"
duration_hours = 0.5
terminal = { outcome = "completed" }

# ---------------------------------------------------------------------------
# Account check-in — the recurring relationship work on EXISTING
# wholesale accounts. `sale` covers acquisition (sales-rep);
# account-manager (12) and sales-lead (6) had nothing. Subject is any
# active account (no distribution → uniform draw).
# ---------------------------------------------------------------------------

[[workflow]]
kind = "account-checkin"
metadata = { owner_role = "account-manager" }
label = "Wholesale Account Check-in"
category = "sales"
subject_kinds = ["account"]
description = """
Recurring account-management touch on an existing wholesale account:
review order history + aging + tap performance, make the check-in
call, log the growth plan with the sales lead.
"""

[[workflow.step]]
title = "trigger"
kind = "trigger"
ready_when = "true"
title_template = "Account cadence fires — check in on {subject.id}"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "account-checkin-cadence" }

[[workflow.step]]
title = "review-account-history"
kind = "task"
ready_when = "steps.trigger.done"
authority_role = "account-manager"
title_template = "Review account history — {subject.id}"
duration_hours = 1.0

# labor vs wall clock split: the call itself is ~an hour of a
# person's day, but phone tag with a bar buyer spans a day of
# calendar. Pacing reads the wall leg; capacity meters the labor leg.
[[workflow.step]]
title = "checkin-call"
kind = "outreach"
ready_when = "steps.review-account-history.done"
authority_role = "account-manager"
title_template = "Check-in call — {subject.id}"
labor_hours = 1.0
wall_clock_hours = 24.0
metadata_defaults = { channel = "phone", recipient_id = "{subject.id}", purpose = "Standing check-in: reorder cadence, tap rotation, service issues" }

[[workflow.step]]
title = "growth-review"
kind = "task"
ready_when = "steps.checkin-call.done"
authority_role = "sales-lead"
title_template = "Log growth plan + next actions — {subject.id}"
duration_hours = 1.0
terminal = { outcome = "completed" }

