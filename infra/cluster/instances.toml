# infra/cluster/instances.toml — the BOSS instances the converge renders
# and applies on EVERY train (backlog 07d7549c car 1; design ffc83387,
# decided by David 2026-09-16: "Playground is part of prod. Let's do (b)
# and just be very reliable!" — and prod converges every train too:
# "I want to run our operations so tightly that we are confident in
# converging prod on every train").
#
# Read by infra/cluster/render-instance.sh (`--all`), and through it by
# infra/forge/cluster-deploy-runner.sh (the apply, the image roll and
# the step-plugins ConfigMap, per instance) and
# infra/cluster/check-manifests-applied.sh (every rendered object must
# be present). ONE key per line, `key = "value"` or `key = true|false`:
# the renderer reads this file with the shell, not a TOML parser — the
# same rule infra/estate/roles.toml lives under.
#
# THE SOURCE. The manifests under infra/cluster/manifests/ are written
# for exactly one instance — the one named here as `source` — and every
# other instance is that directory with these four values substituted
# for the source's. So the source's values here MUST be what the files
# say: the renderer refuses a source value it cannot find in the
# instance manifests, because a prod entry that drifted from the files
# would turn every other instance's substitution into a no-op that
# answers instead of erroring. When prod's TLS front moves to
# www.algedonic.dev (car 2, after David's DNS), the file and this line
# change together, and the byte-identity test in
# crates/core/boss-testing/tests/render_instance_sh.rs holds them equal.
#
# THE FOUR PARAMETERS
#   namespace  the Kubernetes namespace; `boss` or `boss-<name>`. boss-dev
#              is the pipeline's and is refused.
#   tenant     the tenant manifest, repo-relative, under examples/; the
#              image ships it at /opt/boss/<tenant>.
#   sim        BOSS_SIM_ENABLED — whether the tenant's tick daemon
#              generates packets. Parked on prod 2026-09-05 (packet
#              59f063de); the playground is where it runs from now.
#   hostname   the TLS front's vhost (boss-tls-front.yaml). Its cert is
#              the `boss-tls` Secret in the instance's namespace, minted
#              out of band.
#
# THE SECRETS, and the one optional key. The manifests reference their
# Secrets by name (README: secrets never live here), and the converge
# DERIVES the list an instance needs from its rendered manifests
# (cluster-deploy-lib.sh manifest_secrets — every secretKeyRef, secret
# volume and imagePullSecret not marked optional; measured 2026-09-16
# for the playground: boss-oidc, boss-secrets, boss-session-key,
# boss-tls, forgejo-registry, resend). PROVISIONING MINTS THEM (backlog
# dc1bc724; David 2026-09-16: no hand work unless absolutely required):
# on the first converge that finds one absent the runner creates the
# instance's Namespace and then, per Secret and by its class
# (cluster-deploy-lib.sh provision_instance_secrets):
#
#   internal  boss-secrets, boss-session-key — random values nobody
#             needs to know, minted in the namespace; names only reach
#             the journal and the packet
#   shared    forgejo-registry, resend — the same credential as another
#             instance's, COPIED from the namespace of the instance this
#             one names as `shares_with` (the optional fifth key, an
#             instance name in this file; the renderer refuses one it
#             cannot find). Without it they stay absent and are named.
#   root      boss-oidc — created with an EMPTY client-secret: the
#             gateway then boots guest-only (its OidcConfig reads empty
#             as "no OIDC"), and registering the Kanidm client is the
#             ceremony that fills it
#   by hand   anything else — boss-tls until 974d2015 removes its
#             reference
#
# The packet records the line as `instance_secrets_minted`. Then the
# secret gate asks the cluster again: an instance still missing any
# Secret is SKIPPED whole, named as `instances_skipped`, with the
# `kubectl create secret` shapes printed in the journal, and the
# converge exits 0; one that has everything applies on this same
# converge. Prod is applied, rolled, stamped and verified first and is
# unaffected either way.

source = "prod"

[prod]
namespace = "boss"
tenant = "examples/brewery/seeds/tenant.toml"
sim = false
hostname = "boss.algedonic.dev"

[playground]
namespace = "boss-playground"
tenant = "examples/brewery/seeds/tenant.toml"
sim = true
hostname = "playground.algedonic.dev"
# The playground pulls the same images and sends mail as the same
# sender: its shared Secrets are prod's, copied.
shares_with = "prod"
