# boss-break-glass-credentials — the break-glass credential store:
# PUBLIC keys for the hardware security keys that open the emergency
# door (docs/design/break-glass-is-a-key-you-hold.md, Q1-Q6 resolved
# on packet e9703d8f, 2026-09-03).
#
# WHY THIS IS AN IN-TREE ConfigMap AND NOT A Secret (Q5). Every field
# in a record is public by construction: a credential id, a WebAuthn
# public key with its verified attestation, a sign counter, an AAGUID,
# a timestamp, a label. A leaked copy of this file is a leaked public
# key — harmless — which is exactly the property the design buys:
# nothing secret rests anywhere in the break-glass story. The private
# halves are born on the security keys' hardware and cannot leave it.
# Keeping the records in-tree also makes the tree the source of truth
# the correctness protocol wants: the public mirror can carry them,
# a rebuild reproduces them, and converge reapplies them.
#
# HOW RECORDS GET HERE — ENROLLMENT NEVER WRITES THIS OBJECT. The
# gateway does not patch ConfigMaps (contrast the credential broker's
# name-scoped Secret RBAC in boss-credential-broker.yaml, which exists
# because that value is secret and must never transit a human). Here
# the value is public, and an imperative patch to a converge-managed
# object is a change with an expiry — the converge loop reapplies this
# manifest and would silently erase enrolled keys. So the enrollment
# ceremony EMITS the finished record (response body + gateway log
# line) and the operator commits it below; converge applies it; the
# kubelet propagates the update into the gateway's mount within about
# a minute, and the gateway re-reads the directory on every ceremony —
# no restart, no drift, one authoritative copy.
#
# THE ENROLLMENT CEREMONY (run once by David; token admin is his per
# the standing rule — the agent prepares, the human holds the keys):
#
#   1. Arm the bootstrap window. Create the one-ceremony Secret the
#      gateway reads as BOSS_BREAK_GLASS_ENROLL_TOKEN (boss.yaml
#      references it by name, optional):
#        kubectl -n boss create secret generic boss-break-glass-enroll \
#          --from-literal=token="$(openssl rand -base64 24)"
#      then restart the boss pod so the env lands. The window is open
#      ONLY while this token is set AND zero records exist below.
#   2. Open https://<BOSS_PUBLIC_URL>/break-glass in a browser —
#      an unlinked page served by the gateway binary itself (the
#      login page stays button-free; break-glass is a typed URL, not
#      an affordance). Expand "Enrollment".
#   3. Enroll the PRIMARY key: paste the token, label `primary`,
#      touch the key. The page prints the finished record.
#   4. Enroll the BACKUP key the same way, label `backup`. The window
#      is still open because no record has been COMMITTED yet — both
#      keys enroll in one sitting (Q2: both upfront).
#   5. Commit both records into `data:` below as keys `primary.json`
#      and `backup.json` (one JSON object per key, exactly as
#      emitted). Ship the car; converge applies it.
#   6. Disarm: delete the Secret and restart —
#        kubectl -n boss delete secret boss-break-glass-enroll
#      From here on, enrollment (rotation, key replacement) requires
#      an authenticated break-glass session: assert with an enrolled
#      key at /break-glass, then run the enrollment form under that
#      session, commit the new record, remove the old one.
#   7. Verify by effect: /break-glass, touch the primary key — the
#      session that opens carries role `break-glass` (narrow, Q4).
#      Repeat with the backup key. Both must open the door.
#
# SIGN COUNTERS. `sign_count` in a record is the durable clone-
# detection floor. Each successful assertion logs the key's new
# counter; refresh the committed value opportunistically (any car will
# do) so the floor survives gateway restarts. This is best-effort by
# design and said plainly in the module docs (boss-gateway
# src/break_glass.rs).
#
# WHAT ASSERTING GETS YOU (Q4 — deliberately NARROW, not
# platform-admin): deploy rollback + merge approval + auth
# administration, as policy rows on role `break-glass`
# (boss-policy-client src/defaults.rs names the exact mapping).
# The other two levers on the same physical key — kubeconfig via the
# PIV applet, merge approval artifacts via sk-SSH — never touch this
# store; their verifiers are kube-apiserver and Forgejo.
#
# SOAK (Q6): credentials.toml on the boss-auth PVC remains live and
# untouched while this ceremony proves itself in prod. The PVC
# retirement is the follow-up car.
apiVersion: v1
kind: ConfigMap
metadata:
  name: boss-break-glass-credentials
  namespace: boss
  labels:
    app.kubernetes.io/part-of: boss
    boss.dev/purpose: break-glass
# Empty until the enrollment ceremony above fills it. Keys are
# `primary.json` and `backup.json`; each value is one credential
# record exactly as the enrollment ceremony emitted it.
data: {}
