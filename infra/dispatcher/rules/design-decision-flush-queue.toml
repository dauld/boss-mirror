# A recorded design decision queues its doc's flush (cea82de0; the
# handler no-ops the no-pending 400 so answer bursts settle clean).
# Seeded live by 109-dispatcher-rule-flush-queue.sql.
[[rule]]
name = "design-decision-flush-queue"
why = """
A CROSS-DOMAIN reaction: a decision recorded on a review packet queues
the DOCS service's flush of the source doc. Neither side's definition
owns both halves — the review protocol cannot rewrite a document, and
the docs service does not know what a decision step is.
"""
on_event = "docs.design.decision_recorded"
[[rule.do]]
handler = "docs.flush_queue"
