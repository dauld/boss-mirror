# ---------------------------------------------------------------------
# Ask the level question on a clock (packet ae8a14f7).
#
# `design-review-spawn` asks a LEVEL question — "this doc has open
# questions and no open review" — but only ever gets asked on an EDGE,
# `docs.design.indexed`, which by design fires only when a doc's review
# surface CHANGES. Close a review while its questions are still open
# and the doc can never get another one, because nothing about it will
# change again on its own. The 2026-08-13 audit did exactly that to
# five docs and roughly twenty-three questions became unreachable, with
# no mechanism that could ever surface them.
#
# A TIMER, which is this ratchet's standing exemption: no Workflow
# definition can declare "sweep the corpus for docs nobody is
# reviewing", because no packet causes it. The condition is a standing
# state of the corpus, not a reaction to a transition — which is the
# whole bug.
#
# `docs.design.sweep` decides only WHICH docs are orphaned and then
# hands each to `jobs.spawn` as the payload the edge rule would have
# delivered, so these args are `design-review-spawn`'s verbatim and
# must change with them.
#
# Seeded by 141-design-review-level-sweep.sql; present here because
# `dispatcher_rules_seed_matches_toml` compares in BOTH directions.
[[rule]]
name = "design-review-level-sweep"
why = """
A TIMER, the standing exemption, and the clearest case of why it
exists: `design-review-spawn` asks a LEVEL question — this doc has
open questions and no open review — but only ever gets asked on an
EDGE. Close a review while its questions are open and the doc can
never get another one, because nothing about it will change again on
its own; the 2026-08-13 audit did exactly that to five docs and
roughly twenty-three questions became unreachable. No Workflow
definition can declare a sweep of the corpus, because no packet
causes it. It adds no routing: it hands `jobs.spawn` the same args
the edge rule would have. (Ratchet history: 47 -> 48, 2026-08-16.)
"""
schedule = { cadence = "daily", anchor_date = "2026-08-16" }
[[rule.do]]
handler = "docs.design.sweep"
args = { kind = "\"design-doc-review\"", subject_kind = "\"custom\"", subject = "path", title = "title", "metadata.doc_path" = "path", "metadata.doc_title" = "title" }
