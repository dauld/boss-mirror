# 6. DOC STATUS DRIFT. A design doc's `**Status**:` line is
# hand-written and nothing ever updates it. Answering a question is a
# flush, and the flush rewrites the Decision-history section without
# touching the header — so status is stale BY DEFAULT, as fresh as the
# last time a human happened to edit that line (feedback 0b8ae875,
# filed as the mechanism behind bedda461).
#
# The detector already exists: `GET /api/design/stale-statuses` reports
# docs whose status claims live discussion (`draft`, `in-review`,
# `reopened`) while the tracker holds zero open questions for them. It
# has existed and reported to nobody, which is the same defect as the
# conformance script — a check with no caller is not a mechanism.
#
# Deliberately a REPORT feeding a sweep, not a rejection at index time.
# `crates-and-layers.md` reads "in-review (agent draft; the re-tiering
# call is David's)" — legitimately waiting on a person with no
# questions registered. Refusing to index that would be wrong, and a
# rule that has to be right about intent is a rule that will be wrong.
# A sweep puts it in front of someone who can tell the difference.
[[rule]]
name = "maintenance-sweep-doc-status-daily"
why = """
A TIMER, the standing exemption: no packet causes "a day passed", so no
Workflow definition can declare it — a sweep's whole point is to run
when NO event fired. It adds no routing: one firing spawns one
maintenance-sweep packet, and what happens next is that protocol's own
row. A design doc's Status line is hand-written and nothing
updates it, so it is stale by default (feedback 0b8ae875). The
detector already existed at GET /api/design/stale-statuses and
reported to nobody — the same defect as the conformance script.
Deliberately a report feeding a sweep rather than a rejection at
index time: a rule that has to be right about intent will be
wrong. (Ratchet history: 49 -> 50, 2026-08-17.)
"""
version = 2
schedule = { cadence = "daily", anchor_date = "2026-08-17" }
# One outstanding packet per target (0517387b): yesterday's sweep
# still open means today has nothing new to say - spawning a twin
# duplicates the obligation, it does not discharge it.
when = 'NOT open_job_exists("maintenance-sweep", "doc-status")'
[[rule.do]]
handler = "jobs.spawn"
args = { kind = "\"maintenance-sweep\"", subject_kind = "\"custom\"", subject = "\"doc-status\"", title = "\"Design doc status sweep\"", "metadata.target" = "\"doc-status\"", "metadata.area" = "\"docs\"" }
