# maintenance-forge-token-audit — the recurring half of the credential
# hygiene David asked for on 2026-08-27, after a disclosed forge token
# took a database query to identify because nothing recorded which
# process held which credential.
#
# It SURFACES and never prunes. Deleting a token is administration and
# stays with a human, the same way `issue` and `revoke` are the human
# steps of rotate-a-credential. What this removes is the excuse: after
# it runs, "which of these may I delete" has a written answer.
[[workflow]]
kind = "maintenance-forge-token-audit"
label = "Forge token audit"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Compare the forge's live access tokens against the declared inventory in infra/platform/forge-tokens.toml and report the difference. Four kinds of drift: a token on the forge that no one declared (an unattributable credential, which in practice is one nobody dares revoke), a declared token missing from the forge (a revocation nobody wrote down, and a consumer about to fail), a scope that widened behind our back, and a token unused past the staleness window. A declaration entry whose consumer is still UNKNOWN counts as debt in its own right, so a forge that matches the declaration perfectly does NOT pass while any consumer is unidentified. The check is read-only against the forge's SQLite database and never reads the credential columns; the only credential-shaped value it prints is the last eight characters, which is what the forge's own UI shows."
metadata = { owner_role = "platform-admin" }

