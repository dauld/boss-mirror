# ---------------------------------------------------------------------
# rotate-a-credential — one credential rotation, scope to revoke.
#
# The in-tree source of the protocol the credential broker executes
# (packet 7ee101aa). v1 and v2 were authored live via the workflow
# API and had NO in-tree source; this row is the spec as of v3, so a
# fresh deployment seeds the same protocol the live one runs and the
# protocol is reviewable in a diff. LIVE PUBLISH IS SEPARATE: on the
# system of record, registry rows publish via the API (a new version
# superseding v2) — the bundle seeds fresh deployments only and never
# overwrites a live registry.
#
# The Subject is the credential's REGISTRY id (the `credentials`
# table row, e.g. boss-dev-forge-token) — the durable identity that
# survives rotation. Completing `scope` (the dedicated
# `credential-rotation` StepType) hands the rotation to the machine:
# the broker rule fires on `step.done.credential-rotation`, mints,
# installs, verifies by effect, revokes what the scoper named, and
# records each phase twice — as the packet's own machine steps below
# AND as `credential.minted` / `.installed` / `.verified` /
# `.revoked` events on the audit log (the maiden rotation recorded
# only step metadata, findable by archaeology, not by kind).
#
# v3 changes, from David's review of the maiden rotation:
#   - `old_token` surfaced inline on the scope step (optional): the
#     scoper names the kill target so the machine can revoke
#     end-to-end. Absent, the broker leaves `revoke` to its assignee.
#   - `revoke` carries its human runbook as a `procedure`, for the
#     packet where no old_token was named.
#
# NO FIELD EVER CARRIES A CREDENTIAL VALUE — identifiers (a token
# name or numeric id) and observed effects only, on steps and events
# alike.
[[workflow]]
kind = "rotate-a-credential"
label = "Rotate a credential"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Replace one credential's value end-to-end: scope why and where, mint the replacement, install it where its consumers read it, verify it by effect, then — and only then — revoke the old one. The Subject is the credential's registry id (see /api/credentials), so \"when was this last rotated, and why\" is a Subject-history question. A human completes `scope`; the credential broker executes the four machine phases and records each as the packet's own steps plus a credential.* event on the audit log. The destructive step runs LAST, after the new credential is proven working — order is the protocol. No field ever carries a credential value: identifiers and observed effects only."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "requested"
kind = "trigger"
ready_when = "true"
title_template = "Rotation requested"
metadata_defaults = { trigger_kind = "operator", trigger_name = "operator-requests-a-rotation" }

[[workflow.step]]
title = "scope"
kind = "credential-rotation"
ready_when = "steps.requested.done"
title_template = "Scope the rotation"
authority_role = "platform-admin"
[[workflow.step.fields]]
# Inline on the workflow (v3) as well as on the kind bundle: the
# scoper names the OLD token's identifier at the issuer so the broker
# can revoke end-to-end. Optional — absent means the revoke step
# waits for its assignee. NEVER the value.
name = "old_token"
field_type = "string"
required = false

[[workflow.step]]
title = "issue"
kind = "task"
ready_when = "steps.scope.done"
title_template = "Mint the replacement"
[[workflow.step.fields]]
name = "issued"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "issuer"
field_type = "string"
required = false

[[workflow.step]]
title = "install"
kind = "task"
ready_when = "steps.issue.done"
title_template = "Install into the declared storage"
[[workflow.step.fields]]
name = "installed"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "permissions"
field_type = "string"
required = false

[[workflow.step]]
title = "verify"
kind = "task"
ready_when = "steps.install.done"
title_template = "Verify by effect"
[[workflow.step.fields]]
name = "verified"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "method"
field_type = "browser|api|log"
required = false

[[workflow.step]]
title = "revoke"
kind = "task"
ready_when = "steps.verify.done"
title_template = "Revoke the old credential"
metadata_defaults = { procedure = "If the broker revoked automatically (the scope step named old_token), this step is already completed with evidence — nothing to do. Otherwise: identify the OLD token in the forge UI by name — the issue step's recorded evidence names the NEW token (secret-name plus the packet id's first eight), so the old one is the same credential's instance WITHOUT this packet's suffix; confirm nothing still consumes it (the registry row's consumers list), delete it in the forge UI or via the admin API, and record the identifier you deleted. NEVER touch boss-credential-broker-root — it is the root credential the broker mints WITH, not a rotation product." }
[[workflow.step.fields]]
name = "revoked"
field_type = "string"
required = true
[[workflow.step.fields]]
name = "confirmed_dead"
field_type = "string"
required = false

[[workflow.step]]
title = "rotated"
kind = "outcome"
ready_when = "steps.revoke.done"
title_template = "Rotated"
terminal = { outcome = "rotated" }
metadata_defaults = { outcome_kind = "completed" }

[[workflow.step]]
title = "abandoned"
kind = "outcome"
ready_when = "steps.scope.done AND job.metadata.abandoned = \"true\""
title_template = "Abandoned"
terminal = { outcome = "abandoned" }
metadata_defaults = { outcome_kind = "aborted" }

# ---------------------------------------------------------------------
# maintenance-forge-token-audit — the recurring half of the credential
# hygiene David asked for on 2026-08-27, after a disclosed forge token
# took a database query to identify because nothing recorded which
# process held which credential.
#
# It SURFACES and never prunes. Deleting a token is administration and
# stays with a human, the same way `issue` and `revoke` are the human
# steps of rotate-a-credential. What this removes is the excuse: after
# it runs, "which of these may I delete" has a written answer.
[[workflow]]
kind = "maintenance-forge-token-audit"
label = "Forge token audit"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Compare the forge's live access tokens against the declared inventory in infra/platform/forge-tokens.toml and report the difference. Four kinds of drift: a token on the forge that no one declared (an unattributable credential, which in practice is one nobody dares revoke), a declared token missing from the forge (a revocation nobody wrote down, and a consumer about to fail), a scope that widened behind our back, and a token unused past the staleness window. A declaration entry whose consumer is still UNKNOWN counts as debt in its own right, so a forge that matches the declaration perfectly does NOT pass while any consumer is unidentified. The check is read-only against the forge's SQLite database and never reads the credential columns; the only credential-shaped value it prints is the last eight characters, which is what the forge's own UI shows."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "scheduled"
kind = "trigger"
ready_when = "true"
title_template = "Timer fired"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "systemd-timer" }

[[workflow.step]]
title = "run"
kind = "task"
ready_when = "steps.scheduled.done"
title_template = "Run to completion"
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "result"
field_type = "string"
required = true

[[workflow.step]]
title = "completed"
kind = "outcome"
ready_when = "steps.run.done AND steps.run.metadata.result = \"ok\""
title_template = "Maintenance completed"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "completed" }

# A run that died records how (boss-step.sh from ExecStopPost: the
# service result and exit status), and lands here instead of looking
# like a run still in progress. Before 2026-09-05 this terminal did
# not exist and a failed run's packet stayed open until a later run
# closed it "ok".
[[workflow.step]]
title = "failed"
kind = "outcome"
ready_when = "steps.run.done AND steps.run.metadata.result != \"ok\""
title_template = "Maintenance failed"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "failed" }

# ---------------------------------------------------------------------
# THE TWO MOST-EDITED PROTOCOLS, moved here from Rust (e332a320).
#
# user-feedback reached v13 and pr-train v16 through the API, and both
# were ALSO maintained by hand in registry.rs so a fresh install seeded
# the same thing — 453 lines of Rust kept equal to production by
# somebody's diligence. There was no drift when this was measured, and
# that is the point: the mechanism was a habit, and CLAUDE.md 9a is
# explicit that a habit standing where a mechanism belongs is the thing
# to fix. Nothing compared the two, because bootstrap_reconcile
# correctly preserves operator-edited rows and therefore never looks.
# The failure mode was silent and only reachable on a fresh install —
# the one path with no operator to notice.
#
# These blocks were GENERATED from the live v13 and v16 specs and
# verified to round-trip: emitted, parsed back, and compared
# field-by-field against the live JSON before the Rust was deleted.
# ---------------------------------------------------------------------

[[workflow]]
kind = "user-feedback"
label = "User feedback"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Feedback a user sent from the chrome bar. The Subject is the surface it is about (a `custom` Subject whose id is the route path), so \"what have people said about this page\" is a Subject-history question rather than a report someone has to build. Modelled as a Job deliberately: feedback is work, and work that lives outside the Job model is work the system cannot route, own, or audit. Triage forks on a disposition, so routing an item is a recorded decision that opens the next step."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "submitted"
kind = "trigger"
ready_when = "true"
title_template = "Feedback submitted"
metadata_defaults = { trigger_kind = "operator", trigger_name = "user-submits-feedback" }

[[workflow.step]]
title = "triage"
kind = "task"
ready_when = "steps.submitted.done"
title_template = "Triage feedback"
authority_role = "platform-admin"
[[workflow.step.fields]]
name = "disposition"
field_type = "reproduce|design|build|duplicate|needs-info|decline"
required = true
[[workflow.step.fields]]
name = "finding"
field_type = "string"
required = false

[[workflow.step]]
title = "investigate"
kind = "task"
ready_when = "steps.triage.done AND steps.triage.metadata.disposition = \"reproduce\""
title_template = "Reproduce and investigate"
authority_role = "platform-admin"
metadata_defaults = { disposition = "resolved" }
[[workflow.step.fields]]
name = "disposition"
field_type = "resolved|design|build|needs-info|duplicate|decline"
required = true
[[workflow.step.fields]]
name = "finding"
field_type = "string"
required = false

[[workflow.step]]
title = "design-review"
kind = "answer-question"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"design\") OR (steps.investigate.done AND steps.investigate.metadata.disposition = \"design\")"
title_template = "Decide the design"
authority_role = "platform-admin"
metadata_defaults = { verdict = "" }

[[workflow.step]]
title = "build"
kind = "task"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"build\") OR (steps.investigate.done AND steps.investigate.metadata.disposition = \"build\") OR (steps.design-review.done AND steps.design-review.metadata.verdict = \"approved\")"
title_template = "Build the change"
authority_role = "platform-admin"

[[workflow.step]]
title = "needs-info"
kind = "task"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"needs-info\") OR (steps.investigate.done AND steps.investigate.metadata.disposition = \"needs-info\")"
title_template = "Waiting on the reporter"
authority_role = "platform-admin"

[[workflow.step]]
title = "duplicate"
kind = "outcome"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"duplicate\") OR (steps.investigate.done AND steps.investigate.metadata.disposition = \"duplicate\")"
title_template = "Closed as a duplicate"
terminal = { outcome = "duplicate" }
metadata_defaults = { outcome_kind = "withdrawn" }

[[workflow.step]]
title = "declined"
kind = "outcome"
ready_when = "(steps.triage.done AND steps.triage.metadata.disposition = \"decline\") OR (steps.investigate.done AND steps.investigate.metadata.disposition = \"decline\") OR (steps.design-review.done AND steps.design-review.metadata.verdict = \"declined\")"
title_template = "Closed without action"
terminal = { outcome = "declined" }
metadata_defaults = { outcome_kind = "aborted" }

[[workflow.step]]
title = "closed"
kind = "outcome"
ready_when = "(steps.investigate.done AND steps.investigate.metadata.disposition = \"resolved\") OR (steps.design-review.done AND steps.design-review.metadata.verdict = \"answered\") OR steps.build.done OR steps.needs-info.done"
title_template = "Feedback closed"
terminal = { outcome = "completed" }
metadata_defaults = { outcome_kind = "completed" }

