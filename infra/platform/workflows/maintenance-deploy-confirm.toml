# boss-deploy-confirm.service — RETIRED PRODUCER. The unit and the
# bare-metal deploy it armed for were deleted on 2026-09-18 (design
# 42277636, backlog e109bd71); nothing opens this kind any more, and it
# never filed a packet (0 ever, audit 2026-09-18). This file stays only
# because the live registry still carries the kind `active`, and the
# authored bundle must describe what the registry holds
# (the-live-protocols-are-the-authored-protocols).
#
# WHY IT IS STILL HERE (measured 2026-09-18, backlog ed64f852). The
# operator retired the kind at 12:20Z, as maintenance-gate-seed was on
# 2026-09-12 (4247deca) — and at 12:42Z the next boot's platform seed
# published it again as v3, active, because the seed reads "present"
# as "an active row exists" and a retired kind with a bundle file is,
# by that reading, missing (boss_platform_workflow_seed.rs; the same
# insert-if-missing rule that makes a deleted file re-insert nothing).
# So a retire cannot stick while this file is in the tree, and the file
# cannot leave while the registry admits the kind. The order that ends
# it: the seed learns that a retired version is a decision it must not
# revert; the operator retires the kind once more; this file goes.
[[workflow]]
kind = "maintenance-deploy-confirm"
label = "Deploy confirm"
category = "platform"
subject_kinds = ["custom"]
owning_team = "platform"
description = "Evaluates the active generation and reverts on failure. The one chore here that CHANGES production on its own, which is the strongest case for it leaving a packet behind: a revert nobody can see is a deploy nobody can explain."
metadata = { owner_role = "platform-admin" }

[[workflow.step]]
title = "scheduled"
kind = "trigger"
ready_when = "true"
title_template = "Timer fired"
metadata_defaults = { trigger_kind = "periodic", trigger_name = "systemd-timer" }

[[workflow.step]]
title = "run"
kind = "task"
ready_when = "steps.scheduled.done"
title_template = "Run to completion"
authority_role = "platform-admin"
fields = [{ name = "result", field_type = "string", required = true }]

[[workflow.step]]
title = "completed"
kind = "outcome"
ready_when = "steps.run.done AND steps.run.metadata.result = \"ok\""
title_template = "Maintenance completed"
metadata_defaults = { outcome_kind = "completed" }
terminal = { outcome = "completed" }

# A run that died records how (boss-step.sh from ExecStopPost: the
# service result and exit status), and lands here instead of looking
# like a run still in progress. Before 2026-09-05 this terminal did
# not exist and a failed run's packet stayed open until a later run
# closed it "ok".
[[workflow.step]]
title = "failed"
kind = "outcome"
ready_when = "steps.run.done AND steps.run.metadata.result != \"ok\""
title_template = "Maintenance failed"
metadata_defaults = { outcome_kind = "aborted" }
terminal = { outcome = "failed" }
